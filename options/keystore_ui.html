<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>BB PQC Keystore</title>
        <link rel="stylesheet" href="../css/style.css">
        <script src="keystore_ui.js" defer></script>
    </head>

    <body>
        <div class="pqc-options-page">

            <!-- Reset keys section -->
            <p class="pqc-title">Your keys</p>
            <br />
            <div class="pqc-status neutral" id="pqc-own-status">Checking...</div>
            <div class="pqc-row" style="margin-top: 8px;">
                <input type="password" id="pqc-delete-password" placeholder="Master password">
                <button class="danger" id="pqc-delete-btn">Delete my keys</button>
            </div>
            <div class="pqc-error" id="pqc-delete-error"></div>

            <hr class="pqc-divider" style="margin: 20px 0;">

            <!-- Import contacts form section -->
            <p class="pqc-title">Import a contact's public key</p>
            <br />
            <p class="pqc-subtitle">Import a .pem file exported by PQC Security from another person, and link it to one of your contacts.</p>

            <label for="pqc-contact-select">Contact</label>
            <select id="pqc-contact-select"></select>

            <label for="pqc-manual-email" style="margin-top: 8px;">Or enter an email address</label>
            <input type="email" id="pqc-manual-email" placeholder="name@example.com">

            <label for="pqc-pem-file" style="margin-top: 8px;">Public key file (.pem)</label>
            <input type="file" id="pqc-pem-file" accept=".pem,.txt">

            <button class="primary" id="pqc-import-btn" style="margin-top: 10px;">Import key</button>
            <div class="pqc-error" id="pqc-import-error"></div>

            <hr class="pqc-divider" style="margin: 20px 0;">

            <!-- Imported contacts section -->
            <p class="pqc-title">Stored public keys</p>
            <br />
            <ul class="pqc-list" id="pqc-contacts-list"></ul>
        </div>
    </body>

</html>
